<style>
    /* === 1. 全域基礎設定 === */
    :root {
        --primary-color: #0366d6;
        --accent-color: #f89617;
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --text-main: #24292e;
        --text-sub: #586069;
        --code-color: #24292e;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 24px 32px;
        text-align: center;
        min-height: 100vh;
        width: 100%;
    }

    * {
        box-sizing: border-box;
    }

    /* === 2. 標題區（滿版延伸） === */
    .header {
        margin-bottom: 24px;
        padding: 28px 24px;
        background-color: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        width: 100%;
        margin: 10px auto 24px auto;
    }

    h1 {
        color: var(--primary-color);
        font-size: clamp(1.8em, 5vw, 2.5em);
        margin: 0 0 10px 0;
    }

    p {
        font-size: clamp(1em, 2vw, 1.1em);
        color: var(--text-sub);
        margin: 0;
    }

    /* === 3. 頁籤 === */
    .tabs-container {
        width: 100%;
        margin: 0 auto 24px auto;
        display: flex;
        justify-content: center;
        gap: 15px;
        border-bottom: 2px solid #e1e4e8;
        padding-bottom: 0;
    }

    .tab-btn {
        padding: 12px 25px;
        font-size: 1.1em;
        font-weight: 600;
        color: var(--text-sub);
        background: none;
        border: none;
        border-bottom: 4px solid transparent;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: -2px;
    }

    .tab-btn:hover {
        color: var(--primary-color);
        background-color: rgba(3, 102, 214, 0.05);
        border-radius: 8px 8px 0 0;
    }

    .tab-btn.active {
        color: var(--primary-color);
        border-bottom-color: var(--primary-color);
    }

    .tab-content {
        display: none;
        animation: fadeInContent 0.4s ease;
        width: 100%;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes fadeInContent {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* === 4. 卡片容器（全寬自適應網格） === */
    .project-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        width: 100%;
        margin: 0 auto;
        padding: 0;
    }

    .section-title {
        margin: 40px 0 24px 0;
        color: var(--text-main);
        border-bottom: 3px solid #dee2e6;
        display: inline-block;
        padding-bottom: 5px;
        font-size: 1.5em;
    }

    /* === 5. 專案卡片（優化版） === */
    .project-card {
        display: flex;
        flex-direction: column;
        text-align: left; /* 改為左對齊 */
        background-color: var(--card-bg);
        padding: 24px;
        border: 1px solid #e1e4e8; /* 淺灰邊框 */
        border-top: 4px solid var(--primary-color); /* 頂部強調線 */
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); /* 更柔和的陰影 */
        transition: all 0.3s ease;
        position: relative;
        min-height: 180px;
    }

    .project-card.hf-card {
        border-top: 4px solid var(--accent-color); /* HF 的專屬顏色 */
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        border-color: #d1d5da;
    }

    .project-card-title {
        font-size: 1.25em;
        font-weight: 700;
        color: var(--text-main);
        word-break: break-word;
        line-height: 1.3;
        margin-bottom: 8px;
    }

    /* 新增：專案描述樣式 */
    .project-card-desc {
        font-size: 0.95em;
        color: var(--text-sub);
        line-height: 1.5;
        margin: 0 0 20px 0;
        flex-grow: 1; /* 佔滿剩餘空間，把按鈕推到底部 */
        
        /* 限制最多顯示 3 行，多餘用 ... 省略 */
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .project-card-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
    }

    .project-card-btn {
        flex: 1;
        padding: 10px 12px;
        text-decoration: none;
        text-align: center;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9em;
        transition: all 0.2s ease;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .page-btn {
        background-color: var(--primary-color);
    }

    .project-card.hf-card .page-btn {
        background-color: var(--accent-color);
    }

    .page-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(3, 102, 214, 0.2);
    }

    .project-card.hf-card .page-btn:hover {
        box-shadow: 0 4px 8px rgba(248, 150, 23, 0.2);
    }

    .code-btn {
        background-color: #f6f8fa;
        color: var(--code-color);
        border: 1px solid #d1d5da;
    }

    .code-btn:hover {
        background-color: #e1e4e8;
        transform: translateY(-2px);
    }

    /* === 6. 搜尋結果樣式 (微調以符合新風格) === */
    .search-box {
        margin: 0 auto 24px auto;
        width: 100%;
        max-width: 800px;
        display: flex;
        gap: 12px;
    }

    input[type="text"] {
        flex: 1;
        padding: 15px;
        font-size: 16px;
        border: 2px solid #dee2e6;
        border-radius: 10px;
        outline: none;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus {
        border-color: var(--primary-color);
    }

    .search-btn {
        padding: 15px 30px;
        background-color: #2ea44f;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
    }

    
    .search-btn.btn-active {
        background-color: #d73a49;
    }
    .search-btn.btn-active:hover {
        background-color: #cb2431;
    }

    /* === 狀態通知橫幅（備援/快取提示） === */
    .status-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 auto 20px auto;
        padding: 12px 20px;
        background-color: #fff8c5;
        border: 1px solid #e3b341;
        border-radius: 10px;
        color: #735c0f;
        font-size: 0.95em;
        text-align: left;
        width: 100%;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .status-banner.show {
        display: flex;
    }
    .status-banner-btn {
        padding: 6px 14px;
        border: 1px solid #d1d5da;
        border-radius: 6px;
        background-color: #ffffff;
        color: #24292e;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85em;
        white-space: nowrap;
        transition: background 0.2s;
    }
    .status-banner-btn:hover {
        background-color: #f3f4f6;
    }
    .search-btn:hover {
        background-color: #2c974b;
        transform: translateY(-2px);
    }

    .repo-card {
        background-color: var(--card-bg);
        padding: 24px;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        text-align: left;
        text-decoration: none;
        color: var(--text-main);
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        min-height: 140px;
    }

    .repo-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        border-color: var(--primary-color);
    }

    .repo-name { font-size: 1.25em; font-weight: 700; color: var(--primary-color); margin-bottom: 5px; word-break: break-all; }
    .repo-owner { font-size: 0.9em; color: var(--text-sub); margin-bottom: 10px; }
    .repo-stats { margin-top: auto; font-size: 0.9em; color: var(--text-sub); display: flex; align-items: center; }
    .star-icon { color: #f1e05a; margin-right: 5px; }

    .message { font-size: 1.2em; color: var(--text-sub); margin-top: 40px; }

    @media (max-width: 600px) {
        .search-box { flex-direction: column; padding: 0 10px; }
        .search-btn { width: 100%; }
    }

/* 新版本通知 */

    position: fixed;
    bottom: 1.5rem;

    color: #fff;

#update-banner button {
    padding: 0.35rem 1rem;
    border: none;
    border-radius: 999px;
    background: #fff;
    color: #0366d6;
    font-weight: 600;
    cursor: pointer;
}

<body>

<div class="header">
    <h1>🚀 Cormort 的專案空間</h1>
    <p>我的個人作品集與開源專案探索</p>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab(event, 'my-projects')">📁 我的專案</button>
    <button class="tab-btn" onclick="switchTab(event, 'global-search')">🔍 搜尋大神</button>
</div>

<div id="my-projects" class="tab-content active">
    <div id="api-status-banner" class="status-banner">
        <span id="api-status-text"></span>
        <button class="status-banner-btn" onclick="loadGitHubProjects(true)">重試同步</button>
    </div>
    <div class="search-box">
        <input type="text" id="project-filter" placeholder="🔍 篩選我的專案名稱或說明...">
    </div>
    <div id="category-chips" class="category-chips"></div>
    <div id="filter-empty" class="message" hidden>找不到符合的專案</div>
    <h2 class="section-title"><span style="color:var(--primary-color);">GitHub Pages</span></h2>
    <div id="github-projects-list" class="project-container">
        <div class="message">正在載入...</div>
    </div>

    <h2 class="section-title"><span style="color:var(--accent-color);">Hugging Face Spaces</span></h2>
    <div id="huggingface-spaces-list" class="project-container"></div>
</div>

<div id="global-search" class="tab-content">
    <div style="max-width: 600px; margin: 0 auto 20px auto; color: #586069;">
        輸入關鍵字，尋找 GitHub 上星星數最高的熱門專案
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="輸入關鍵字 (例：python crawler, budget)...">
        <button class="search-btn" id="search-btn" onclick="handleSearchClick()">搜尋</button>
    </div>

    <div id="search-results-list" class="project-container">
        <div class="message">請輸入關鍵字並按下搜尋... 🦕</div>
    </div>
</div>

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');

        { name: 'Excel / 文件', re: /excel|xls|docx|word|epub|json|xml|html|slide|report|試算|表格|文件/ },
        { name: '學習', re: /learning|geometry|essay|guwen|scholar|binary-cpu|作文|學習/ },
        { name: '工作管理', re: /timeline|scheduler|strategy|task_|quickboard|管理|策略/ },
    ];
    const OTHER_CATEGORY = '其他';
    // 關鍵字分錯時，在這裡依專案名稱指定分類
    const CATEGORY_OVERRIDES = {
        'word_docx_editor_pdf': 'Excel / 文件',
    };
    function categorize(name, text) {
        if (CATEGORY_OVERRIDES[name]) return CATEGORY_OVERRIDES[name];
        const t = text.toLowerCase();
        const hit = CATEGORIES.find(c => c.re.test(t));
        return hit ? hit.name : OTHER_CATEGORY;
    }

    function createCard(name, pageUrl, codeUrl, description, isHuggingFace = false) {
        const card = document.createElement('div');
        card.className = isHuggingFace ? 'project-card hf-card' : 'project-card';
        card.dataset.category = categorize(name, `${name} ${description || ''} ${pageUrl}`);

        const title = document.createElement('div');
        title.className = 'project-card-title';
        title.textContent = name;

        // 新增描述區塊
        const desc = document.createElement('div');
        desc.className = 'project-card-desc';
        desc.textContent = description ? description : '點擊下方按鈕前往查看此專案的詳細內容與原始碼。';

        const actions = document.createElement('div');
        actions.className = 'project-card-actions';

        const pageBtn = document.createElement('a');
        pageBtn.className = 'project-card-btn page-btn';
        pageBtn.href = pageUrl;
        pageBtn.target = '_blank';
        pageBtn.rel = 'noopener';
        pageBtn.innerHTML = '📄 前往專案';

        const codeBtn = document.createElement('a');
        codeBtn.className = 'project-card-btn code-btn';
        codeBtn.href = codeUrl;
        codeBtn.target = '_blank';
        codeBtn.rel = 'noopener';
        codeBtn.innerHTML = '💻 原始碼';

        actions.appendChild(pageBtn);
        actions.appendChild(codeBtn);
        
        card.appendChild(title);
        card.appendChild(desc); // 加入描述
        card.appendChild(actions);

        return card;
    }

    const apiStatusBanner = document.getElementById('api-status-banner');
    const apiStatusText = document.getElementById('api-status-text');

    function renderGitHubProjects(reposList) {
        if (!Array.isArray(reposList) || reposList.length === 0) {
            githubProjectsList.innerHTML = '<div class="message">找不到任何 GitHub Pages 專案。</div>';
            return;
        }

        const EXCLUDED_REPOS = [GITHUB_USERNAME.toLowerCase(), 'my-github-pages'];
        const fragment = document.createDocumentFragment();

        reposList.forEach(repo => {
            const name = repo.name;
            if (EXCLUDED_REPOS.includes(name.toLowerCase())) return;

            const pageUrl = repo.page_url || `${PAGES_BASE_URL}/${name}/`;
            const codeUrl = repo.html_url || `https://github.com/${GITHUB_USERNAME}/${name}`;
            const desc = repo.description || repo.desc || '';
            const card = createCard(name, pageUrl, codeUrl, desc, false);
            fragment.appendChild(card);
        });

        githubProjectsList.innerHTML = '';
        githubProjectsList.appendChild(fragment);

        if (typeof applyFilter === 'function') {
            applyFilter();
        }
    }

    function showNotice(msg) {
        if (apiStatusBanner && apiStatusText) {
            apiStatusText.innerHTML = msg;
            apiStatusBanner.classList.add('show');
        }
    }

    function hideNotice() {
        if (apiStatusBanner) {
            apiStatusBanner.classList.remove('show');
        }
    }

    async function loadGitHubProjects(forceRefresh = false) {
        let hasRendered = false;

        // 1. 優先從 localStorage 讀取快取（0 秒秒開）
        try {
            const cachedRaw = localStorage.getItem(CACHE_KEY);
            if (cachedRaw) {
                const cached = JSON.parse(cachedRaw);
                if (cached && Array.isArray(cached.data) && cached.data.length > 0) {
                    renderGitHubProjects(cached.data);
                    hasRendered = true;
                }
            }
        } catch (e) {
            console.warn('讀取本地快取失敗', e);
        }

        // 2. 若無本地快取，以靜態內建清單渲染，絕不顯示錯誤
        if (!hasRendered) {
            renderGitHubProjects(STATIC_GITHUB_REPOS);
            hasRendered = true;
        }

        // 3. 背景非同步向 GitHub API 同步最新專案（Stale-While-Revalidate）
        try {
            const response = await fetch(API_URL);

            if (response.status === 403) {
                const resetTime = response.headers.get('x-ratelimit-reset');
                let resetStr = '';
                if (resetTime) {
                    const d = new Date(parseInt(resetTime, 10) * 1000);
                    resetStr = `（預計 ${d.toLocaleTimeString()} 自動解除）`;
                }
                throw new Error(`GitHub API 目前達到訪客每小時存取限制 ${resetStr}`);
            }

            if (!response.ok) {
                throw new Error(`GitHub 服務暫時無法連線 (HTTP ${response.status})`);
            }

            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
                const EXCLUDED_REPOS = [GITHUB_USERNAME.toLowerCase(), 'my-github-pages'];
                const formatted = data
                    .filter(repo => !EXCLUDED_REPOS.includes(repo.name.toLowerCase()))
                    .map(repo => ({
                        name: repo.name,
                        description: repo.description,
                        html_url: repo.html_url,
                        page_url: `${PAGES_BASE_URL}/${repo.name}/`
                    }));

                // 更新 localStorage
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        data: formatted
                    }));
                } catch (e) {
                    console.warn('寫入快取失敗', e);
                }

                // 重新渲染為最新清單
                renderGitHubProjects(formatted);
                hideNotice();
            }
        } catch (error) {
            console.warn('GitHub API 同步失敗，維持備援/快取展示:', error.message);
            showNotice(`⚡ <strong>提醒：</strong>${error.message}。目前已自動切換為本機快取與備援專案清單，各專案功能皆可正常使用。`);
        }
    }

    // 啟動 GitHub 專案載入
    loadGitHubProjects();

    // 載入 Hugging Face
    if (HUGGINGFACE_SPACES.length === 0) {
        huggingfaceSpacesList.innerHTML = '<div class="message">目前沒有 Hugging Face Spaces。</div>';
    } else {
        HUGGINGFACE_SPACES.forEach(space => {
            const pageUrl = space.url;
            const codeUrl = `${space.url}/tree/main`;
            const card = createCard(space.name, pageUrl, codeUrl, space.desc, true);
            huggingfaceSpacesList.appendChild(card);
        });
    }

    // ==============================
    // 2. 全域搜尋（點第 2 次解除查詢）
    // ==============================
    const searchResultsList = document.getElementById('search-results-list');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');

    let isSearchActive = false;
    let lastSearchQuery = '';

    searchInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            searchRepos();
        }
    });

    searchInput.addEventListener('input', function() {
        if (isSearchActive && searchInput.value.trim() !== lastSearchQuery) {
            isSearchActive = false;
            updateSearchButtonState();
        }
    });

    function handleSearchClick() {
        const query = searchInput.value.trim();
        // 若當前處於查詢結果狀態，點第 2 次即解除查詢
        if (isSearchActive) {
            resetSearch();
            return;
        }
        searchRepos();
    }

    function resetSearch() {
        searchInput.value = '';
        lastSearchQuery = '';
        isSearchActive = false;
        updateSearchButtonState();
        searchResultsList.innerHTML = '<div class="message">請輸入關鍵字並按下搜尋... 🦕</div>';
    }

    function updateSearchButtonState() {
        if (isSearchActive) {
            searchBtn.textContent = '✕ 解除查詢';
            searchBtn.classList.add('btn-active');
        } else {
            searchBtn.textContent = '搜尋';
            searchBtn.classList.remove('btn-active');
        }
    }

    async function searchRepos() {
        const query = searchInput.value.trim();
        if (!query) {
            alert('請輸入搜尋關鍵字！');
            return;
        }

        isSearchActive = true;
        lastSearchQuery = query;
        updateSearchButtonState();

        searchResultsList.innerHTML = '<div class="message">正在搜尋 GitHub 資料庫... ⏳</div>';
        const SEARCH_API = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=12`;

        try {
            const response = await fetch(SEARCH_API);
            if (response.status === 403) throw new Error('搜尋太頻繁，請稍後再試');
            if (!response.ok) throw new Error('網路連線問題');

            const data = await response.json();
            searchResultsList.innerHTML = '';

            if (!data.items || data.items.length === 0) {
                searchResultsList.innerHTML = '<div class="message">找不到相關專案 🦕</div>';
                return;
            }

            data.items.forEach(repo => {
                const card = document.createElement('a');
                card.className = 'repo-card';
                card.href = repo.html_url;
                card.target = '_blank';

                const description = repo.description ? repo.description : '無專案描述';
                const shortDesc = description.length > 90 ? description.substring(0, 90) + '...' : description;

                card.innerHTML = `
                    <div>
                        <div class="repo-name">${repo.name}</div>
                        <div class="repo-owner">👤 ${repo.owner.login}</div>
                        <div class="project-card-desc" style="margin-top:8px;">${shortDesc}</div>
                    </div>
                    <div class="repo-stats" style="margin-top:10px;">
                        <span class="star-icon">★</span> ${formatNumber(repo.stargazers_count)}
                        <span style="margin-left: 15px;">📅 ${new Date(repo.updated_at).toLocaleDateString()}</span>
                    </div>
                `;
                searchResultsList.appendChild(card);
            });
        } catch (error) {
            searchResultsList.innerHTML = `<div class="message">⚠️ ${error.message}</div>`;
        }
    }

    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num;
    }

    // ==============================
    // 篩選我的專案（卡片為動態產生，於輸入時即時比對）
    // ==============================
    let activeCategory = '';
    function applyFilter() {
        const q = document.getElementById('project-filter').value.trim().toLowerCase();
        let shown = 0;
        document.querySelectorAll('#my-projects .project-card').forEach(card => {
            const matchCat = !activeCategory || card.dataset.category === activeCategory;
            const matchText = !q || card.textContent.toLowerCase().includes(q);
            card.hidden = !(matchCat && matchText);
            if (!card.hidden) shown++;
        });
        document.getElementById('filter-empty').hidden = shown > 0;
    }
    document.getElementById('project-filter').addEventListener('input', applyFilter);

    const chipsBox = document.getElementById('category-chips');
    ['', ...CATEGORIES.map(c => c.name), OTHER_CATEGORY].forEach(cat => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'category-chip' + (cat ? '' : ' active');
        chip.textContent = cat || '全部';
        chip.addEventListener('click', () => {
            chipsBox.querySelectorAll('.category-chip').forEach(c => c.classList.toggle('active', c === chip));
            activeCategory = cat;
            applyFilter();
        });
        chipsBox.appendChild(chip);
    });

    // ==============================
    // 3. Service Worker (PWA)
    // ==============================
    if ('serviceWorker' in navigator) {
        let reloading = false;
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                const banner = document.getElementById('update-banner');
                const showUpdate = worker => {
                    banner.hidden = false;
                    document.getElementById('update-btn').onclick = () => {
                        reloading = true;
                        worker.postMessage('SKIP_WAITING');
                    };
                };
                if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const worker = reg.installing;
                    worker.addEventListener('statechange', () => {
                        // 已有舊版在控制頁面才算「更新」，首次安裝不提示
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate(worker);
                    });
                });
                // 長時間開著的 App 回到前景時也檢查一次
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') reg.update();
                });
            });
        });
        // 只在使用者按下更新後重新載入
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) location.reload();
        });
    }
</script>
<div id="update-banner" hidden>
    <span>有新版本可用</span>
    <button type="button" id="update-btn">立即更新</button>
</div>
</body>
</html>
