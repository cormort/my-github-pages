<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cormort 的專案空間 🌟</title>
<style>
    /* === 1. 全域基礎設定 === */
    :root {
        --primary-color: #0366d6;
        --accent-color: #f89617;
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --text-main: #24292e;
        --text-sub: #586069;
        --code-color: #24292e;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        text-align: center;
        min-height: 100vh;
    }

    /* === 2. 標題區 === */
    .header {
        margin-bottom: 30px;
        padding: 30px 20px;
        background-color: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 1000px;
        margin: 20px auto 30px auto;
    }

    h1 {
        color: var(--primary-color);
        font-size: clamp(1.8em, 5vw, 2.5em);
        margin: 0 0 10px 0;
    }

    p {
        font-size: clamp(1em, 2vw, 1.1em);
        color: var(--text-sub);
        margin: 0;
    }

    /* === 3. 頁籤 === */
    .tabs-container {
        max-width: 1000px;
        margin: 0 auto 30px auto;
        display: flex;
        justify-content: center;
        gap: 15px;
        border-bottom: 2px solid #e1e4e8;
        padding-bottom: 0;
    }

    .tab-btn {
        padding: 12px 25px;
        font-size: 1.1em;
        font-weight: 600;
        color: var(--text-sub);
        background: none;
        border: none;
        border-bottom: 4px solid transparent;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: -2px;
    }

    .tab-btn:hover {
        color: var(--primary-color);
        background-color: rgba(3, 102, 214, 0.05);
        border-radius: 8px 8px 0 0;
    }

    .tab-btn.active {
        color: var(--primary-color);
        border-bottom-color: var(--primary-color);
    }

    .tab-content {
        display: none;
        animation: fadeInContent 0.4s ease;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes fadeInContent {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* === 4. 卡片容器 === */
    .project-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px; /* 加大一點間距 */
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 10px;
    }

    .section-title {
        margin: 40px 0 24px 0;
        color: var(--text-main);
        border-bottom: 3px solid #dee2e6;
        display: inline-block;
        padding-bottom: 5px;
        font-size: 1.5em;
    }

    /* === 5. 專案卡片（優化版） === */
    .project-card {
        display: flex;
        flex-direction: column;
        text-align: left; /* 改為左對齊 */
        background-color: var(--card-bg);
        padding: 24px;
        border: 1px solid #e1e4e8; /* 淺灰邊框 */
        border-top: 4px solid var(--primary-color); /* 頂部強調線 */
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); /* 更柔和的陰影 */
        transition: all 0.3s ease;
        position: relative;
        min-height: 180px;
    }

    .project-card.hf-card {
        border-top: 4px solid var(--accent-color); /* HF 的專屬顏色 */
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        border-color: #d1d5da;
    }

    .project-card-title {
        font-size: 1.25em;
        font-weight: 700;
        color: var(--text-main);
        word-break: break-word;
        line-height: 1.3;
        margin-bottom: 8px;
    }

    /* 新增：專案描述樣式 */
    .project-card-desc {
        font-size: 0.95em;
        color: var(--text-sub);
        line-height: 1.5;
        margin: 0 0 20px 0;
        flex-grow: 1; /* 佔滿剩餘空間，把按鈕推到底部 */
        
        /* 限制最多顯示 3 行，多餘用 ... 省略 */
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .project-card-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
    }

    .project-card-btn {
        flex: 1;
        padding: 10px 12px;
        text-decoration: none;
        text-align: center;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9em;
        transition: all 0.2s ease;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .page-btn {
        background-color: var(--primary-color);
    }

    .project-card.hf-card .page-btn {
        background-color: var(--accent-color);
    }

    .page-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(3, 102, 214, 0.2);
    }

    .project-card.hf-card .page-btn:hover {
        box-shadow: 0 4px 8px rgba(248, 150, 23, 0.2);
    }

    .code-btn {
        background-color: #f6f8fa;
        color: var(--code-color);
        border: 1px solid #d1d5da;
    }

    .code-btn:hover {
        background-color: #e1e4e8;
        transform: translateY(-2px);
    }

    /* === 6. 搜尋結果樣式 (微調以符合新風格) === */
    .search-box {
        margin: 0 auto 40px auto;
        max-width: 600px;
        display: flex;
        gap: 10px;
    }

    input[type="text"] {
        flex: 1;
        padding: 15px;
        font-size: 16px;
        border: 2px solid #dee2e6;
        border-radius: 10px;
        outline: none;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus {
        border-color: var(--primary-color);
    }

    .search-btn {
        padding: 15px 30px;
        background-color: #2ea44f;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
    }

    .search-btn:hover {
        background-color: #2c974b;
        transform: translateY(-2px);
    }

    .repo-card {
        background-color: var(--card-bg);
        padding: 24px;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        text-align: left;
        text-decoration: none;
        color: var(--text-main);
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        min-height: 140px;
    }

    .repo-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        border-color: var(--primary-color);
    }

    .repo-name { font-size: 1.25em; font-weight: 700; color: var(--primary-color); margin-bottom: 5px; word-break: break-all; }
    .repo-owner { font-size: 0.9em; color: var(--text-sub); margin-bottom: 10px; }
    .repo-stats { margin-top: auto; font-size: 0.9em; color: var(--text-sub); display: flex; align-items: center; }
    .star-icon { color: #f1e05a; margin-right: 5px; }

    .message { font-size: 1.2em; color: var(--text-sub); margin-top: 40px; }

    @media (max-width: 600px) {
        .search-box { flex-direction: column; padding: 0 10px; }
        .search-btn { width: 100%; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>🚀 Cormort 的專案空間</h1>
    <p>我的個人作品集與開源專案探索</p>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab(event, 'my-projects')">📁 我的專案</button>
    <button class="tab-btn" onclick="switchTab(event, 'global-search')">🔍 搜尋大神</button>
</div>

<div id="my-projects" class="tab-content active">
    <h2 class="section-title"><span style="color:var(--primary-color);">GitHub Pages</span></h2>
    <div id="github-projects-list" class="project-container">
        <div class="message">正在載入...</div>
    </div>

    <h2 class="section-title"><span style="color:var(--accent-color);">Hugging Face Spaces</span></h2>
    <div id="huggingface-spaces-list" class="project-container"></div>
</div>

<div id="global-search" class="tab-content">
    <div style="max-width: 600px; margin: 0 auto 20px auto; color: #586069;">
        輸入關鍵字，尋找 GitHub 上星星數最高的熱門專案
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="輸入關鍵字 (例：python crawler, budget)...">
        <button class="search-btn" onclick="searchRepos()">搜尋</button>
    </div>

    <div id="search-results-list" class="project-container">
        <div class="message">請輸入關鍵字並按下搜尋... 🦕</div>
    </div>
</div>

<script>
    // ==============================
    // 0. Tab 切換
    // ==============================
    function switchTab(event, tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // ==============================
    // 1. 個人專案
    // ==============================
    const GITHUB_USERNAME = 'cormort';
    const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&direction=desc&per_page=100`;
    const PAGES_BASE_URL = `https://${GITHUB_USERNAME}.github.io`;

    const HUGGINGFACE_SPACES = [
        { name: "台灣open資料視覺化儀表板", url: "https://huggingface.co/spaces/cormort/tw_statistic_map", desc: "上傳縣市等欄位之資料可生成台灣視覺化地圖" },
        { name: "審計圖像全自動比對系統", url: "https://huggingface.co/spaces/cormort/extract_images_from_pdf", desc: "比對文件中重複出現或高度相似之圖片" },
        { name: "政府採購網查詢工具", url: "https://huggingface.co/spaces/cormort/procurement-crawler-py", desc: "政府採購網查詢工具" },
        { name: "極速文件掃描器", url: "https://huggingface.co/spaces/cormort/image_correct", desc: "快速校正歪斜的文件照片，提升閱讀體驗" },
        { name: "IVOD 自動轉錄系統", url: "https://huggingface.co/spaces/cormort/ivod-automation-center", desc: "立法院各委員隨選影片逐字稿轉錄器" },
        { name: "股價k棒分析系統", url: "https://huggingface.co/spaces/cormort/stockprice", desc: "個股股票k棒分析" },
        { name: "音樂比對分析器", url: "https://huggingface.co/spaces/cormort/pitch-analyzer", desc: "分析音高與旋律，進行精準的音樂比對" },
        { name: "簡易描碼系統", url: "https://huggingface.co/spaces/cormort/ScanItem", desc: "支援QR code及Bar code（二維碼）" },
    ];

    const githubProjectsList = document.getElementById('github-projects-list');
    const huggingfaceSpacesList = document.getElementById('huggingface-spaces-list');

    // 修改版：將描述直接渲染到卡片中，而非藏在 Tooltip 裡
    function createCard(name, pageUrl, codeUrl, description, isHuggingFace = false) {
        const card = document.createElement('div');
        card.className = isHuggingFace ? 'project-card hf-card' : 'project-card';

        const title = document.createElement('div');
        title.className = 'project-card-title';
        title.textContent = name;

        // 新增描述區塊
        const desc = document.createElement('div');
        desc.className = 'project-card-desc';
        desc.textContent = description ? description : '點擊下方按鈕前往查看此專案的詳細內容與原始碼。';

        const actions = document.createElement('div');
        actions.className = 'project-card-actions';

        const pageBtn = document.createElement('a');
        pageBtn.className = 'project-card-btn page-btn';
        pageBtn.href = pageUrl;
        pageBtn.target = '_blank';
        pageBtn.rel = 'noopener';
        pageBtn.innerHTML = '📄 前往專案';

        const codeBtn = document.createElement('a');
        pageBtn.className = 'project-card-btn page-btn';
        codeBtn.className = 'project-card-btn code-btn';
        codeBtn.href = codeUrl;
        codeBtn.target = '_blank';
        codeBtn.rel = 'noopener';
        codeBtn.innerHTML = '💻 原始碼';

        actions.appendChild(pageBtn);
        actions.appendChild(codeBtn);
        
        card.appendChild(title);
        card.appendChild(desc); // 加入描述
        card.appendChild(actions);

        return card;
    }

    // 載入 GitHub
    fetch(API_URL)
        .then(response => {
            if (response.status === 403) throw new Error('API 速率限制已達上限。');
            return response.json();
        })
        .then(data => {
            githubProjectsList.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
                githubProjectsList.innerHTML = '<div class="message">找不到任何 GitHub Pages 專案。</div>';
                return;
            }

            const EXCLUDED_REPOS = [GITHUB_USERNAME.toLowerCase(), 'my-github-pages'];

            data.forEach(repo => {
                if (EXCLUDED_REPOS.includes(repo.name.toLowerCase())) return;

                const pageUrl = `${PAGES_BASE_URL}/${repo.name}/`;
                const codeUrl = repo.html_url;
                const card = createCard(repo.name, pageUrl, codeUrl, repo.description, false);
                githubProjectsList.appendChild(card);
            });
        })
        .catch(error => {
            console.error(error);
            githubProjectsList.innerHTML = `<div class="message">載入失敗。</div>`;
        });

    // 載入 Hugging Face
    if (HUGGINGFACE_SPACES.length === 0) {
        huggingfaceSpacesList.innerHTML = '<div class="message">目前沒有 Hugging Face Spaces。</div>';
    } else {
        HUGGINGFACE_SPACES.forEach(space => {
            const pageUrl = space.url;
            const codeUrl = `${space.url}/tree/main`;
            const card = createCard(space.name, pageUrl, codeUrl, space.desc, true);
            huggingfaceSpacesList.appendChild(card);
        });
    }

    // ==============================
    // 2. 全域搜尋
    // ==============================
    const searchResultsList = document.getElementById('search-results-list');
    const searchInput = document.getElementById('search-input');

    searchInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") searchRepos();
    });

    async function searchRepos() {
        const query = searchInput.value.trim();
        if (!query) {
            alert("請輸入搜尋關鍵字！");
            return;
        }

        searchResultsList.innerHTML = '<div class="message">正在搜尋 GitHub 資料庫... ⏳</div>';
        const SEARCH_API = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=12`;

        try {
            const response = await fetch(SEARCH_API);
            if (response.status === 403) throw new Error("搜尋太頻繁，請稍後再試");
            if (!response.ok) throw new Error("網路連線問題");

            const data = await response.json();
            searchResultsList.innerHTML = '';

            if (data.items.length === 0) {
                searchResultsList.innerHTML = '<div class="message">找不到相關專案 🦕</div>';
                return;
            }

            data.items.forEach(repo => {
                const card = document.createElement('a');
                card.className = 'repo-card';
                card.href = repo.html_url;
                card.target = '_blank';

                const description = repo.description ? repo.description : "無專案描述";
                const shortDesc = description.length > 90 ? description.substring(0, 90) + "..." : description;

                card.innerHTML = `
                    <div>
                        <div class="repo-name">${repo.name}</div>
                        <div class="repo-owner">👤 ${repo.owner.login}</div>
                        <div class="project-card-desc" style="margin-top:8px;">${shortDesc}</div>
                    </div>
                    <div class="repo-stats" style="margin-top:10px;">
                        <span class="star-icon">★</span> ${formatNumber(repo.stargazers_count)}
                        <span style="margin-left: 15px;">📅 ${new Date(repo.updated_at).toLocaleDateString()}</span>
                    </div>
                `;
                searchResultsList.appendChild(card);
            });
        } catch (error) {
            searchResultsList.innerHTML = `<div class="message">⚠️ ${error.message}</div>`;
        }
    }

    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num;
    }
</script>
</body>
</html>
